[build]
# Use nixpacks (Railway's default builder) — no Dockerfile needed
# The build command installs Patchright's Chromium binary
builder = "NIXPACKS"

[deploy]
# The start script installs system deps (apt-get) then runs the worker
startCommand = "bash scripts/railway-start.sh"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# Resource limits to stay within Railway's free tier ($5 credit)
# The worker only needs CPU/RAM when actively scraping
[deploy.resources]
# Leave defaults — Railway autoscales
